name: Release codex-design tombstone

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-codex-design-tombstone
  cancel-in-progress: false

jobs:
  release:
    name: Publish @12ui/codex-design 0.1.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Verify fixed tombstone version
        run: node -e 'const pkg=require("./package.json");if(pkg.version!=="0.1.11"){throw new Error(`Expected 0.1.11, got ${pkg.version}`)}'

      - name: Verify tombstone
        run: npm run verify

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e 'const fs=require("node:fs");const pack=JSON.parse(fs.readFileSync("pack.json","utf8"))[0];const actual=pack.files.map(({path})=>path).sort();const expected=["README.md","bin/codex-design.js","package.json"];if(JSON.stringify(actual)!==JSON.stringify(expected)){throw new Error(`Unexpected package files: ${actual.join(", ")}`)}'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Tag tombstone
        run: |
          git tag codex-design-v0.1.11
          git push origin codex-design-v0.1.11

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: codex-design-v0.1.11
          release_name: codex-design v0.1.11 retirement tombstone
          body: |
            `@12ui/codex-design` has been retired.

            Migrate with:
            ```bash
            npx -y @12ui/design skill install
            ```
          draft: false
          prerelease: false
